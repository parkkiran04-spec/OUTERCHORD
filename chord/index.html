<!DOCTYPE html>
<html lang="ko">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  @font-face{
    font-family:'Nomark';
    src: url('../fonts/nomark.otf') format('opentype');
    font-display: swap;
  }
  :root{
    --red:#b01d12;
    --ink:#1e1e1e;      /* the vinyl, and the title on the red panel */
    --ring:#313131;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#191818;
    font-family:'Pretendard Variable', Pretendard, sans-serif; -webkit-font-smoothing:antialiased; }

  /* The layout is the 2000×1125 design sheet (음원화면, half of its 4000×2250
     export), drawn at that size and scaled to fit the window; every
     position below is read straight off it. The backdrop and the red panel
     reach past the sheet to the window's edges. */
  .stage{ position:fixed; left:0; top:0; width:2000px; height:1125px; transform-origin:0 0; z-index:2; }
  .stage > *{ position:absolute; }

  /* the disc: centre (502, 563), radius 389 — its left half under the panel */
  #disc{ left:102px; top:163px; width:800px; height:800px; }
  /* the arm swings about a pivot above the sheet so the needle can ride the groove */
  /* the tube runs on 200 units above the sheet (assets/tonearm.png is extended), so
     swinging the arm never brings its cut end into view; it turns about (1110, -150) */
  #arm{ left:746.5px; top:-200px; width:378.5px; height:702px; transform-origin:363.5px 50px; pointer-events:none; }

  .chordbox{ right:1260px; top:280px; text-align:right; color:var(--red); pointer-events:none; }
  .chordbox .k{ font:700 33px/1 'Pretendard Variable', Pretendard, sans-serif; letter-spacing:-.01em; }
  .chordbox .v{ margin-top:10px; font:400 86px/1 'Nomark', 'Pretendard Variable', serif; white-space:nowrap; width:max-content; margin-left:auto; }

  .round{ width:81px; height:81px; margin:0; padding:0; border-radius:50%; cursor:pointer;
    border:2px solid var(--red); background:var(--ink); color:var(--red);
    display:grid; place-items:center; transition:background .15s steps(2,end), color .15s steps(2,end); }
  .round svg{ width:34px; height:34px; fill:currentColor; }
  .round:hover:not(:disabled), .round:focus-visible, .round.is-on{ background:var(--red); color:var(--ink); outline:none; }
  .round:disabled{ opacity:.35; cursor:default; }
  #playBtn{ left:745.5px; top:800.5px; }
  #pauseBtn{ left:638.5px; top:877.5px; }

  /* the red panel; its left edge and height are stretched to the window in JS */
  .panel{ left:0; top:0; width:502px; height:1125px; background:var(--red); z-index:3; }
  /* 125px Nomark at -35 tracking is the sheet's SONG / TITLE exactly: caps 90 tall,
     baselines 125 apart, the last one at y=1025 */
  .title{ left:113px; bottom:82px; width:370px; z-index:4; margin:0; color:var(--ink); letter-spacing:-.035em;
    font:400 125px/125px 'Nomark', 'Pretendard Variable', serif; text-transform:uppercase; }
  .title span{ display:block; width:max-content; white-space:nowrap; }

  #logo{ left:1499.5px; top:172px; width:369px; height:249.5px; pointer-events:none; }

  .pill{ right:134px; height:61px; padding:0 32px; border:2px solid var(--red); border-radius:999px;
    background:transparent; color:var(--red); cursor:pointer;
    font:500 21px/1 'Pretendard Variable', Pretendard, sans-serif; letter-spacing:-.02em;
    transition:background .15s steps(2,end), color .15s steps(2,end); }
  .pill:hover:not(:disabled), .pill:focus-visible{ background:var(--red); color:var(--ink); outline:none; }
  .pill:disabled{ opacity:.35; cursor:default; }
  #archiveBtn{ top:446px; width:278px; }
  #remakeBtn{ top:529px; width:157px; padding:0; }
  #qrBtn{ top:606px; width:157px; padding:0; }
  #commentBtn{ top:683px; width:190px; padding:0; }
  a.pill{ display:flex; align-items:center; justify-content:center; box-sizing:border-box; text-decoration:none; }

  /* where the sounds came from, and how many */
  .src{ display:flex; justify-content:space-between; align-items:center; height:40px; color:var(--red); pointer-events:none; }
  .src .n{ font:500 28px/1 'Pretendard Variable', Pretendard, sans-serif; letter-spacing:-.03em; }
  .src .c{ font:300 28px/1 'Pretendard Variable', Pretendard, sans-serif; font-variant-numeric:tabular-nums; }
  .src.off{ opacity:.45; }
  .src.l{ left:1002px; width:318px; }
  .src.r{ left:1457px; width:411px; }

  .status{ right:132px; top:1050px; color:var(--red); opacity:.7; pointer-events:none;
    font:400 16px/1.4 'Pretendard Variable', Pretendard, sans-serif; letter-spacing:-.01em; text-align:right; }

  .message{ left:1000px; top:520px; width:760px; transform:translate(-50%,-50%); z-index:6; text-align:center;
    font:500 30px/1.7 'Pretendard Variable', Pretendard, sans-serif; color:#e8e2d4;
    background:rgba(25,24,24,.86); padding:34px 44px; border-radius:8px; white-space:pre-line; }
  .message[hidden]{ display:none; }

  /* calibration: ?guide lays the design export over the page */
  .guide{ left:0; top:0; width:2000px; height:1125px; opacity:.45; pointer-events:none; z-index:9; }
</style>
</head>
<body>

<main class="stage" id="stage">
  <canvas id="disc" aria-label="지금까지 모인 소리로 만든 음악의 레코드"></canvas>
  <img id="arm" src="assets/tonearm.png" alt="">

  <div class="chordbox" aria-live="polite"><div class="k">CHORD</div><div class="v" id="chordName">—</div></div>
  <button class="round" id="pauseBtn" type="button" aria-label="일시정지" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx=".5"/><rect x="14" y="5" width="4" height="14" rx=".5"/></svg>
  </button>
  <button class="round" id="playBtn" type="button" aria-label="재생" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
  </button>

  <div class="panel" id="panel"></div>
  <h1 class="title" id="title" aria-live="polite"><span>Outer</span><span>Chord</span></h1>

  <img id="logo" src="assets/logo.png" alt="OUTER CHORD — 성간 미아를 위한 불협화음">

  <button class="pill" id="archiveBtn" type="button" disabled>아카이브 및 저장소로 이동</button>
  <button class="pill" id="remakeBtn" type="button" disabled>다시 만들기</button>
  <button class="pill" id="qrBtn" type="button" disabled>QR로 받기</button>
  <a class="pill" id="commentBtn" href="../comments/index.html">코멘트 남기기</a>

  <div id="sources"></div>
  <div class="status" id="status">소리를 모으는 중…</div>
  <div class="message" id="message" hidden></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../shared/outer-chord.js"></script>
<script src="../shared/backdrop.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   1. Where the sounds come from
   ===================================================================== */
// the synth, the record, the song format and the archive live in
// shared/outer-chord.js, which the phone page and the archive use too
const OC = window.OuterChord;
const { SOURCES, ORDER, BPM, BEAT, BAR, STEPS, STEP, NAMES, clamp, fold } = OC;

const hz2midi = f => 69 + 12 * Math.log2(f / 440);
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

/* Every piece logs in its own shape; they all come out of here as
     { src, time (ms), kind: 'tone' | 'kick' | 'tick' | 'wash',
       midi, dur (s), vel (0..1), pan (-1..1) | null, sess }
   or null for things that were not a sound (mute toggles, page start...). */
const tone = (src, time, midi, dur, vel, pan, sess) =>
  isFinite(midi) && midi > 0 ? { src, time, kind: 'tone', midi, dur: clamp(num(dur, .4), .05, 6), vel: clamp(num(vel, .5), .02, 1), pan, sess } : null;
const hit = (src, time, kind, vel, pan, sess) => ({ src, time, kind, vel: clamp(num(vel, .5), .05, 1), pan, sess });

const NORMALIZE = {
  cattle(e){
    const time = num(e.t, num(e.st, 0)), sess = e.s;
    const pan = e.x != null ? clamp(e.x / 960 - 1, -1, 1) : null;
    const vel = num(e.v, e.by === 'human' ? .75 : .45);
    switch (e.type) {
      case 'heartbeat': return hit('cattle', time, 'kick', .8, 0, sess);
      case 'drop': case 'vessel-flood': case 'beam-noise': case 'capture':
        return hit('cattle', time, 'wash', .5, pan, sess);
      case 'audio-start': return null;
    }
    return e.f > 0 ? tone('cattle', time, hz2midi(e.f), e.d, vel, pan, sess) : null;
  },
  e(e, sessionStart){
    const time = sessionStart + num(e.t, 0), sess = e.session;
    switch (e.type) {
      case 'note':  return tone('e', time, e.midi, num(e.dur, 400) / 1000, e.vel, null, sess);
      case 'heart': return hit('e', time, 'kick', e.strong ? .9 : .6, 0, sess);
      case 'glass': return hit('e', time, 'tick', .6, null, sess);
      case 'shatter': return hit('e', time, 'wash', .8, null, sess);
    }
    return null;
  },
  d(e){
    const time = num(e.ts, Date.parse(e.iso) || 0), sess = e.session;
    const pan = e.x != null ? clamp(e.x * 2 - 1, -1, 1) : null;
    if (e.src === 'mute' || e.src === 'unmute') return null;
    if (e.src === 'pulse') return hit('d', time, 'kick', .5, pan, sess);
    return e.freq > 0 ? tone('d', time, e.midi || hz2midi(e.freq), e.dur, e.vel * 3, pan, sess) : null;
  },
  imnota(e){
    const time = num(e.t, Date.parse(e.rt) || 0), sess = e.s;
    switch (e.type) {
      case 'note': return tone('imnota', time, e.midi, e.dur, .6, null, sess);
      case 'hum': case 'inhale': return hit('imnota', time, 'wash', .4, null, sess);
      case 'crunch': case 'pass': case 'error': return hit('imnota', time, 'tick', .5, null, sess);
    }
    return null;
  },
  tenshi(e, sessionStart, sess){
    const time = sessionStart + num(e.t, 0);
    const pan = e.x != null ? clamp(e.x * 2 - 1, -1, 1) : null;
    if (e.f > 0) return tone('tenshi', time, hz2midi(e.f), e.dur, e.vel, pan, sess);
    if (e.type === 'flood') return hit('tenshi', time, 'wash', .45, pan, sess);
    return e.type ? hit('tenshi', time, 'tick', .35, pan, sess) : null;
  },
  // Passacaglia: every note a visitor paints onto a wall (c3/sound-log.js)
  c3(e){
    if (!(e.f > 0)) return null;
    return tone('c3', num(e.t, 0), hz2midi(e.f), .6, .6, null, e.s || e.session);
  },
  // OUTER CHORD: only what the visitor plays — a click held down, a sweep of
  // the pointer across the scale, the beam swung. The stars' twinkles and
  // the ring's ticks play by themselves and are left out.
  outerchord(e){
    const time = num(e.t, Date.parse(e.rt) || 0), sess = 'oc';
    const pan = e.x != null ? clamp((e.x > 1.5 ? e.x / 100 : e.x) * 2 - 1, -1, 1) : null;
    switch (e.type) {
      case 'click': return e.freq > 0 ? tone('outerchord', time, hz2midi(e.freq), num(e.duration, .5), .75, pan, sess) : null;
      case 'hover': return e.freq > 0 ? tone('outerchord', time, hz2midi(e.freq), .25, .35, pan, sess) : null;
      case 'beam-whoosh': return hit('outerchord', time, 'wash', .5, pan, sess);
    }
    return null;
  },
};

/* The server copy is the whole archive, so it wins whenever it answers.
   Opened as a plain file, or on static hosting with no server behind it,
   each piece falls back to what it kept in this browser. */
const onServer = location.protocol.startsWith('http');

async function getJSON(url){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}
const lines = text => text.split('\n').filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch (_) { return null; } }).filter(Boolean);
const local = key => { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } };

const LOADERS = {
  async cattle(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../cattlemutilation/api/sounds?since=0&limit=100000000')) }; } catch (_) {}
    return { from: 'local', raw: local('cattle-mutilation-sound-pending-v1') || [] };
  },
  async e(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../e/api/sounds')) }; } catch (_) {}
    const sessions = local('drawn-groove/v1:memory') || [];
    return { from: 'local', raw: sessions.flatMap(s => (s.events || []).map(ev => ({ ...ev, session: s.session }))) };
  },
  async d(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../d/api/sounds?date=all')) }; } catch (_) {}
    return { from: 'local', raw: local('noctiluca.soundlog.v1') || [] };
  },
  async imnota(){
    if (onServer) try {
      const dates = JSON.parse(await getJSON('../imnota/api/sounds/dates'));
      const days = await Promise.all(dates.map(d => getJSON('../imnota/api/sounds/' + d).then(lines)));
      return { from: 'server', raw: days.flat() };
    } catch (_) {}
    return { from: 'local', raw: local('notalien.soundmem') || [] };
  },
  async tenshi(){
    if (onServer) try {
      const raw = lines(await getJSON('../tenshi/memory')).map(l => l.data).filter(Boolean);
      return { from: 'server', raw, grouped: true };
    } catch (_) {}
    const store = local('tenshi.memory.v1');
    return { from: 'local', raw: (store && store.sessions) || [], grouped: true };
  },
  async c3(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../c3/api/sounds')) }; } catch (_) {}
    return { from: 'local', raw: local('passacaglia.soundmem') || [] };
  },
  async outerchord(){
    // the piece keeps no copy in the browser; without the server there is nothing to read
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../outerchord/api/sound-log')) }; } catch (_) {}
    return { from: 'local', raw: [] };
  },
};

async function collect(){
  const all = [], info = {};
  await Promise.all(ORDER.map(async key => {
    let got;
    try { got = await LOADERS[key](); } catch (_) { got = { from: 'none', raw: [] }; }
    const out = [];
    const raw = Array.isArray(got.raw) ? got.raw : [];
    if (key === 'tenshi') {
      // one entry per upload (server) or per visit (local): {session|id, start, events}
      for (const g of raw) {
        const s = g.session || g;
        const start = Date.parse(s.start) || 0;
        for (const ev of g.events || []) { const n = NORMALIZE.tenshi(ev, start, s.id); if (n) out.push(n); }
      }
    } else if (key === 'e') {
      for (const ev of raw) { const n = NORMALIZE.e(ev, Date.parse(ev.session) || 0); if (n) out.push(n); }
    } else {
      for (const ev of raw) { const n = ev && NORMALIZE[key](ev); if (n) out.push(n); }
    }
    info[key] = { from: got.from, count: out.length };
    all.push(...out);
  }));
  all.sort((a, b) => a.time - b.time);
  return { events: all, info };
}

/* =====================================================================
   2. Composing: the archive, read front to back, becomes a row of bars
   The result is the compact song (see shared/outer-chord.js): every value
   already rounded to what the phone page and the archive will decode, so
   the song played here is exactly the one that leaves in the QR code.
   ===================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// n roughly equal, chronological slices of a list
function slices(list, n){
  const out = [];
  for (let i = 0; i < n; i++) out.push(list.slice(Math.floor(i * list.length / n), Math.floor((i + 1) * list.length / n)));
  return out;
}
// pick up to k items, keeping their order
function sample(list, k, rnd){
  if (list.length <= k) return list.slice();
  const idx = new Set();
  while (idx.size < k) idx.add(Math.floor(rnd() * list.length));
  return [...idx].sort((a, b) => a - b).map(i => list[i]);
}

function compose(events, seed){
  const rnd = mulberry32(seed);
  const tones = events.filter(e => e.kind === 'tone');
  const hits = events.filter(e => e.kind !== 'tone');
  if (!tones.length && !hits.length) return null;

  const bars = clamp(Math.round(Math.sqrt(tones.length || hits.length) * 1.6), 8, 32);
  const toneGroups = slices(tones, bars);
  const hitGroups = slices(hits, bars);
  const c = { v: 1, bars, chords: [], mel: [], dr: [] };
  let chord = [0, 4, 7];   // only used if the archive opens with silence

  for (let b = 0; b < bars; b++) {
    const group = toneGroups[b];

    // --- the chord: the pitch classes that sounded most in this stretch ---
    if (group.length) {
      const w = new Array(12).fill(0);
      for (const e of group) w[((Math.round(e.midi) % 12) + 12) % 12] += e.vel * (0.5 + Math.min(e.dur, 2));
      const top = w.map((v, pc) => [v, pc]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);
      if (top.length) chord = top;
    }
    c.chords.push(chord.slice());

    // --- the melody: the actual sounds, in the order they were made ---
    const picked = sample(group, 12, rnd);
    c.mel.push(picked.map((e, i) => {
      let step = Math.floor(i * STEPS / picked.length);
      if (rnd() < .3) step = Math.min(STEPS - 1, step + 1);
      const steps = clamp(Math.round(e.dur / STEP), 1, 8);
      const pan = e.pan != null ? e.pan : (rnd() * 2 - 1) * .75;
      return [step, fold(Math.round(e.midi), 55, 88), steps, OC.q7(e.vel), ORDER.indexOf(e.src), OC.qPan(pan)];
    }));

    // --- percussion: heartbeats land on the beat, glass on the offbeats ---
    c.dr.push(sample(hitGroups[b], 8, rnd).map((e, i, arr) => {
      let step = Math.floor(i * STEPS / arr.length);
      if (e.kind === 'kick') step = Math.round(step / 4) * 4 % STEPS;
      else if (e.kind === 'tick') step = (Math.floor(step / 2) * 2 + 2) % STEPS;
      else step = step < 8 ? 0 : 8;
      return [step, OC.KINDS.indexOf(e.kind), OC.qHit(e.vel), OC.qPan(e.pan != null ? e.pan : 0)];
    }));
  }
  return c;
}

/* =====================================================================
   3. The sheet: fitting the 2000×1125 design to the window
   ===================================================================== */
const $ = id => document.getElementById(id);
const stage = $('stage'), panel = $('panel');
const DESIGN_W = 2000, DESIGN_H = 1125;
let S = 1;                       // window px per design unit

function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  S = Math.min(vw / DESIGN_W, vh / DESIGN_H);
  const ox = (vw - DESIGN_W * S) / 2, oy = (vh - DESIGN_H * S) / 2;
  stage.style.transform = `translate(${ox}px, ${oy}px) scale(${S})`;
  // the red panel runs to the window's left edge and its full height
  panel.style.left = (-ox / S) + 'px';
  panel.style.width = (502 + ox / S) + 'px';
  panel.style.top = (-oy / S) + 'px';
  panel.style.height = (DESIGN_H + 2 * oy / S) + 'px';
  sizeDisc();
  fitTitle();
}

/* =====================================================================
   4. The disc and the arm
   The disc is drawn by the shared record (shared/outer-chord.js): every
   melody note an arc along the spiral groove in its piece's colour. The arm
   is the designed picture, swung about a pivot above the sheet so its
   needle rides the groove inward as the song plays; the disc turns so what
   is sounding sits right under that needle.
   ===================================================================== */
const disc = $('disc'), g2 = disc.getContext('2d'), arm = $('arm');
const C = { x: 502, y: 563 }, R = 389;          // disc centre and radius, design units
const DISC_BOX = { x: 102, y: 163, size: 800 }; // the canvas' place on the sheet
const PIVOT = { x: 1110, y: -150 };             // where the arm turns
const TIP0 = { x: 877, y: 500 };                // the needle's point at rest (θ = 0)
let dpr = 1;

function sizeDisc(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(DISC_BOX.size * S * dpr);
  disc.width = disc.height = Math.max(2, px);
}

// the needle's point with the arm turned by θ (radians, clockwise on screen)
function tipAt(theta){
  const dx = TIP0.x - PIVOT.x, dy = TIP0.y - PIVOT.y, c = Math.cos(theta), s = Math.sin(theta);
  return { x: PIVOT.x + dx * c - dy * s, y: PIVOT.y + dx * s + dy * c };
}
const reach = theta => { const t = tipAt(theta); return Math.hypot(t.x - C.x, t.y - C.y); };

/* An arm on a pivot can only swing its needle so far in: the closest it
   gets to the centre is where its arc passes nearest it. The groove is laid
   out over the stretch the needle can actually cover — from just inside
   the rest position to a little short of that closest point — so the line
   that is sounding is always the one under the needle, as on a real
   record, and the inside of the disc is left plain like a run-out. */
let THETA_IN = 0, REACH_MIN = Infinity;
for (let th = 0; th <= 1.6; th += .001) { const d = reach(th); if (d < REACH_MIN) { REACH_MIN = d; THETA_IN = th; } }
const OUTER = .94;                               // the groove band, as fractions of R
const INNER = Math.max(.36, (REACH_MIN + 6) / R);

// the turn that puts the needle `r` from the centre (reach falls steadily up to THETA_IN)
function thetaFor(r){
  let lo = 0, hi = THETA_IN;
  for (let i = 0; i < 28; i++) { const m = (lo + hi) / 2; if (reach(m) > r) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

let armTheta = 0;
function draw(){
  const now = player && player.playing ? player.time() : (player && player.time() > 0 ? player.time() : -1);
  const live = now >= 0 && song;
  // needle radius: resting just outside the groove, or riding it while a song is under way
  let r = reach(0);
  if (live) {
    const band = (OUTER - INNER) * R / song.bars;
    r = Math.max(INNER * R, OUTER * R - (Math.min(now, song.length) / BAR) * band);
  }
  const target = live ? thetaFor(r) : 0;
  armTheta += (target - armTheta) * (live ? .35 : .12);
  arm.style.transform = `rotate(${armTheta}rad)`;
  const tip = tipAt(armTheta);

  const k = S * dpr, size = DISC_BOX.size;
  g2.setTransform(k, 0, 0, k, 0, 0);
  g2.clearRect(0, 0, size, size);
  OC.drawRecord(g2, C.x - DISC_BOX.x, C.y - DISC_BOX.y, R, song, live ? now : -1, {
    spin: idleSpin, tonearm: false, restAlpha: .42,
    vinyl: '#1e1e1e', labelColor: '#b01d12', ringColor: '#313131',
    labelR: 108.5 / R, ringR: 131.5 / R, labelText: false, spindle: false,
    grooveOuter: OUTER, grooveInner: INNER,
    needleAngle: Math.atan2(tip.y - C.y, tip.x - C.x),
  });
}

/* =====================================================================
   5. Page
   ===================================================================== */
const playBtn = $('playBtn'), pauseBtn = $('pauseBtn'), remakeBtn = $('remakeBtn'),
      qrBtn = $('qrBtn'), archiveBtn = $('archiveBtn');
let events = [], compact = null, song = null, code = '', title = '', seed = 1, player = null, idleSpin = 0;
let sourceInfo = {};

// one archive entry per visit to this page: remaking replaces it
const visitId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const createdAt = new Date().toISOString();

function showMessage(text){ const m = $('message'); m.textContent = text; m.hidden = !text; }

// the list as it is laid out on the sheet: two columns, the right one
// starting a row lower; y is each row's middle
const SOURCE_LAYOUT = [
  { key: 'cattle',     col: 'l', y: 663 }, { key: 'imnota', col: 'l', y: 733 },
  { key: 'd',          col: 'l', y: 803 }, { key: 'c3',     col: 'l', y: 873 },
  { key: 'e',          col: 'r', y: 873 }, { key: 'tenshi', col: 'r', y: 942 },
  { key: 'outerchord', col: 'r', y: 1012 },
];
function renderSources(info){
  $('sources').innerHTML = SOURCE_LAYOUT.map(({ key, col, y }) => {
    const c = info[key] ? info[key].count : 0;
    return `<div class="src ${col}${c ? '' : ' off'}" style="position:absolute; top:${y - 20}px">` +
           `<span class="n">${SOURCES[key].name}</span><span class="c">${c.toLocaleString()}</span></div>`;
  }).join('');
}

function renderStatus(info){
  const froms = [...new Set(Object.values(info).map(i => i.from))];
  const where = froms.includes('server') ? '전시 서버 기록' : '이 브라우저 기록';
  $('status').textContent = song
    ? `소리 ${events.length.toLocaleString()}개 · ${song.bars}마디 · ${BPM} BPM · ${OC.fmt(song.length)} · ${where}`
    : where;
}

// Nomark at the sheet's size, brought down until the longest word fits the panel
function fitTitle(){
  const el = $('title');
  // 125px at -35 tracking is the sheet's SONG / TITLE exactly: caps 90 tall,
  // baselines 125 apart, the last one at y = 1025
  let size = 125;
  el.style.fontSize = size + 'px';
  el.style.lineHeight = size + 'px';
  const widest = () => Math.max(...[...el.children].map(s => s.scrollWidth));
  while (size > 56 && widest() > 360) { size -= 3; el.style.fontSize = size + 'px'; el.style.lineHeight = size + 'px'; }
}
function setTitle(text){
  $('title').innerHTML = text.split(' ').map(w => `<span>${w}</span>`).join('');
  $('title').setAttribute('aria-label', '곡 제목: ' + text);
  fitTitle();
}

function setNow(){
  if (!song) return;
  const t = player ? player.time() : 0;
  const b = clamp(Math.floor(t / BAR), 0, song.bars - 1);
  const text = song.barInfo[b].chord.map(pc => NAMES[pc]).join(' ');
  const el = $('chordName');
  if (el.textContent === text) return;
  el.textContent = text;
  // right-aligned at x=740 as on the sheet; a long one (sharps and flats are
  // wide) is set smaller rather than run in under the red panel
  let size = 86;
  el.style.fontSize = size + 'px';
  while (size > 40 && el.scrollWidth > 225) { size -= 4; el.style.fontSize = size + 'px'; }
}

function setButtons(){
  const on = player && player.playing;
  playBtn.classList.toggle('is-on', !!on);
  pauseBtn.classList.toggle('is-on', !on && player && player.time() > 0);
}

async function make(){
  compact = compose(events, seed);
  song = OC.expand(compact);
  if (player) player.halt();
  player = OC.player(song, setButtons);
  setNow();
  code = await OC.encode(compact);
  title = OC.titleFor(code);
  setTitle(title);
  // keep it in the archive (this visit's entry; a remake overwrites it)
  const counts = {};
  for (const k of ORDER) counts[k] = sourceInfo[k] ? sourceInfo[k].count : 0;
  OC.saveSong({
    id: visitId, createdAt, code, title,
    bars: song.bars, length: +song.length.toFixed(2),
    chord: OC.chordName(song.barInfo[0].chord),
    counts, sounds: events.length,
    sessions: new Set(events.map(e => e.src + ':' + e.sess)).size,
  });
}

playBtn.addEventListener('click', () => { if (player && !player.playing) player.play(); setButtons(); });
pauseBtn.addEventListener('click', () => { if (player) player.pause(); setButtons(); });
remakeBtn.addEventListener('click', async () => {
  const was = player && player.playing;
  if (player) player.halt();
  seed = (Math.random() * 2 ** 31) | 0;
  await make();
  if (was) player.play();
  setButtons();
});
// the song, packed into a code, rides in a QR code to the visitor's phone
qrBtn.addEventListener('click', () => {
  if (!code) return;
  try { OC.showQR(code, { title }); }
  catch (err) { showMessage('QR 코드를 만들지 못했습니다: ' + err.message); setTimeout(() => showMessage(''), 3000); }
});
archiveBtn.addEventListener('click', () => { location.href = '../records/index.html'; });

/* The disc turns on the same kind of hand-cranked clock as the index:
   frames held for a slightly different time each, around 24 a second. */
let nextFrame = 0;
function loop(ts){
  if (ts >= nextFrame) {
    nextFrame = ts + (1000 / 24) * (1 + (Math.random() * 2 - 1) * .15);
    if (!(player && player.playing)) idleSpin += .012;
    setNow();
    draw();
  }
  requestAnimationFrame(loop);
}

// a handle for checking the page from the console: draw a frame, read the arm
window.__chord = { draw, setNow, get player() { return player; }, get song() { return song; },
                   get title() { return title; }, get armTheta() { return armTheta; }, reach, thetaFor };

XGBackdrop.mount({ root: '../', logo: $('logo') });
if (/[?&]guide\b/.test(location.search)) {
  const gimg = document.createElement('img'); gimg.className = 'guide'; gimg.src = 'assets/_guide.png'; stage.appendChild(gimg);
}
window.addEventListener('resize', fit);
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
requestAnimationFrame(loop);

/* Once the song is made the archive has done its job: everything collected
   is cleared so the index starts over from nothing — no record at the
   bottom, no sounds waiting — for the next person. The song itself stays in
   this page, so it can still be played, remade and sent from here, and it
   is kept in the song archive (records/).
   On the server nothing is lost: the files move to archive/<time>/. */
const LOCAL_KEYS = [
  'cattle-mutilation-sound-pending-v1',
  'drawn-groove/v1:memory',
  'noctiluca.soundlog.v1', 'noctiluca.soundqueue.v1',
  'notalien.soundmem', 'notalien.soundmem.pending',
  'tenshi.memory.v1',
  'passacaglia.soundmem',
];
async function resetAll(){
  let archived = null;
  if (onServer) {
    try {
      const r = await fetch('../api/reset', { method: 'POST' });
      if (r.ok) archived = (await r.json()).archive;
    } catch (_) { /* static hosting: only this browser's copies to clear */ }
  }
  for (const k of LOCAL_KEYS) { try { localStorage.removeItem(k); } catch (_) {} }
  try { sessionStorage.removeItem('xg.visited'); } catch (_) {}
  return archived;
}

(async () => {
  const { events: evs, info } = await collect();
  events = evs;
  sourceInfo = info;
  renderSources(info);
  if (!events.length) {
    await resetAll();
    renderStatus(info);
    showMessage('아직 모인 소리가 없습니다.\n작품을 체험한 뒤 다시 와 주세요.');
    archiveBtn.disabled = false;
    return;
  }
  seed = (Math.random() * 2 ** 31) | 0;
  await make();
  renderStatus(info);
  [playBtn, pauseBtn, remakeBtn, qrBtn, archiveBtn].forEach(b => (b.disabled = false));
  await resetAll();
})();

})();
</script>
<script src="../shared/back.js" data-visit="0" data-color="#1e1e1e"></script>
