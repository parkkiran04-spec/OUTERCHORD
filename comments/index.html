<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTER CHORD — 코멘트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  /* The comment wall: everything visitors have sent from their phones,
     drifting up over the space ground at one steady speed, fading out at
     the top of their climb and coming back somewhere else on the screen.
     A comment that arrives while the wall is up rises from the middle. */
  :root{ --bg:#0d0c0c; --red:#d12a1c; --ink:#e8e2d4; --muted:rgba(232,226,212,.55); }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); }
  body{ font-family:'Pretendard Variable', Pretendard, sans-serif; -webkit-font-smoothing:antialiased; }

  /* the ground from the main page, taken darker */
  .ground{ position:fixed; inset:0; background:var(--bg) url('../main-assets/background.jpg') center / cover no-repeat; }
  .ground::after{ content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 50%, rgba(8,7,7,.48) 0%, rgba(8,7,7,.72) 100%); }

  .sky{ position:fixed; inset:0; overflow:hidden; }
  .c{ position:absolute; left:0; top:0; margin:0; color:var(--red); white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere;
    font-weight:500; line-height:1.25; letter-spacing:-.05em; opacity:0; will-change:transform, opacity;
    text-shadow:0 0 .5em rgba(209,42,28,.35), 0 .18em .6em rgba(0,0,0,.6); }
  .c.is-new{ color:#ff5a45; }

  .empty{ position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); pointer-events:none;
    font:400 clamp(16px, 1.6vw, 26px)/1.6 'Pretendard Variable', Pretendard, sans-serif; letter-spacing:-.05em; text-align:center; }

  /* where to scan, in the lower right */
  .scan{ position:fixed; right:clamp(16px, 2.4vw, 48px); bottom:clamp(16px, 2.4vw, 48px); z-index:5;
    display:flex; align-items:flex-end; gap:clamp(10px, 1vw, 18px); }
  .scan .qr{ width:clamp(84px, 7.6vw, 150px); aspect-ratio:1; background:#fff; padding:clamp(5px, .45vw, 9px); }
  .scan .qr svg{ display:block; width:100%; height:100%; }
  .scan p{ margin:0; color:var(--ink); text-align:right; font:400 clamp(12px, .95vw, 18px)/1.55 'Pretendard Variable', Pretendard, sans-serif; letter-spacing:-.05em; }
  .scan p b{ display:block; color:var(--red); font-weight:600; font-size:1.2em; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="ground" aria-hidden="true"></div>
<div class="sky" id="sky" aria-live="polite"></div>
<div class="empty" id="empty" hidden>아직 남겨진 코멘트가 없어요.<br>오른쪽 아래 QR코드로 첫 코멘트를 남겨 주세요.</div>

<div class="scan">
  <p><b>코멘트 남기기</b>휴대폰 카메라로 찍으면<br>이 화면에 코멘트를 띄울 수 있어요.</p>
  <div class="qr" id="qr" role="img" aria-label="코멘트를 보내는 페이지로 가는 QR코드"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../shared/comments.js"></script>
<script>
(function () {
  'use strict';
  const sky = document.getElementById('sky');
  const empty = document.getElementById('empty');

  /* ---------------- the QR code ---------------- */
  (function () {
    const qr = qrcode(0, 'M');
    qr.addData(XGComments.sendUrl(), 'Byte');
    qr.make();
    const n = qr.getModuleCount();
    let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
    document.getElementById('qr').innerHTML =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  })();

  /* ---------------- motion ---------------- */
  const SPEED = 2.6;          // rise, in % of the screen height per second — the same for every comment
  const FADE_IN = .2, FADE_OUT = .32;   // parts of each climb spent appearing and disappearing
  const rand = (a, b) => a + Math.random() * (b - a);

  let all = [];               // every comment, oldest first
  let queue = [];             // the order the next ones come up in
  const live = [];            // on screen now: { c, el, x, y, w, h, rise, t, life }
  let waiting = 0;            // seconds until the next one may come up

  // how many at once: more on a bigger screen, never more than there are
  const room = () => Math.min(all.length, Math.round(innerWidth * innerHeight / 72000));

  // size from what it says: a word or two can be big, a sentence smaller
  function sizeFor(text) {
    const n = text.length;
    const [a, b] = n <= 6 ? [5.2, 8] : n <= 14 ? [3.8, 6] : n <= 30 ? [2.8, 4.4] : n <= 60 ? [2.2, 3.2] : [1.8, 2.5];
    return rand(a, b) * innerHeight / 100;       // px
  }

  // Everything rises at the same speed, so two comments keep the same
  // distance for as long as both are up: clearing where the others are now
  // (with a little air around them) clears them for good. The QR corner
  // stands still, so there the whole climb ahead has to stay clear of it.
  const scanBox = document.querySelector('.scan');
  function overlap(x, y, w, h, ahead) {
    const pad = innerHeight * .02;
    const hit = (ax, ay, aw, ah, bx, by, bw, bh) => {
      const ix = Math.min(ax + aw, bx + bw) - Math.max(ax, bx) + pad;
      const iy = Math.min(ay + ah, by + bh) - Math.max(ay, by) + pad;
      return ix > 0 && iy > 0 ? ix * iy : 0;
    };
    let s = 0;
    for (const o of live) s += hit(x, y, w, h, o.x, o.y - (o.t / o.life) * o.rise, o.w, o.h);
    const q = scanBox.getBoundingClientRect();
    s += 4 * hit(x, y - ahead, w, h + ahead, q.left, q.top, q.width, q.height);
    return s;
  }

  // done: how far into its climb it starts (0 for a new one, more when the
  // wall first fills so it doesn't all fade in at once)
  function spawn(c, fresh, done) {
    done = done || 0;
    const el = document.createElement('p');
    el.className = 'c' + (fresh ? ' is-new' : '');
    el.textContent = c.text;
    const size = fresh ? Math.max(sizeFor(c.text), 4.4 * innerHeight / 100) : sizeFor(c.text);
    el.style.fontSize = size + 'px';
    el.style.maxWidth = Math.min(innerWidth * .42, size * 16) + 'px';
    sky.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    const rise = rand(.22, .38) * innerHeight;
    const mx = innerWidth * .04, top = innerHeight * .06;
    let best = null;
    // a few places to try, keeping the one that crowds the others least
    // (a new arrival stays near the middle, where it will be seen)
    for (let i = 0; i < 16; i++) {
      const x = fresh ? (innerWidth - w) / 2 + rand(-.2, .2) * innerWidth
                      : rand(mx, Math.max(mx, innerWidth - mx - w));
      const y = fresh ? innerHeight * rand(.5, .72) - h / 2
                      : rand(top + rise, Math.max(top + rise, innerHeight * .94 - h));
      const s = overlap(x, y - done * rise, w, h, (1 - done) * rise);
      if (!best || s < best.s) best = { x, y, s };
      if (s === 0) break;
    }
    // nowhere clear: leave it for a moment rather than pile it on another
    if (!fresh && best.s > 0) { el.remove(); return false; }
    const life = rise / (SPEED * innerHeight / 100);
    const it = { c, el, x: best.x, y: best.y, w, h, rise, t: done * life, life };
    live.push(it);
    place(it);
    return true;
  }

  function place(it) {
    const p = it.t / it.life;
    const a = p < FADE_IN ? p / FADE_IN : p > 1 - FADE_OUT ? (1 - p) / FADE_OUT : 1;
    it.el.style.opacity = Math.max(0, Math.min(1, a)).toFixed(3);
    it.el.style.transform = `translate3d(${it.x.toFixed(1)}px, ${(it.y - p * it.rise).toFixed(1)}px, 0)`;
  }

  function next() {
    const showing = new Set(live.map(o => o.c.id));
    if (!queue.length) queue = shuffle(all.slice());
    for (let i = 0; i < queue.length; i++) {
      if (!showing.has(queue[i].id)) return queue.splice(i, 1)[0];
    }
    return null;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function step(dt) {
    for (let i = live.length - 1; i >= 0; i--) {
      const it = live[i];
      it.t += dt;
      if (it.t >= it.life) { it.el.remove(); live.splice(i, 1); continue; }
      place(it);
    }
    waiting -= dt;
    if (waiting <= 0 && live.length < room()) {
      const c = next();
      if (c && !spawn(c)) queue.push(c);   // try it again later, another first
      // when the screen is thin, fill it a little faster
      waiting = live.length < room() * .6 ? rand(.15, .6) : rand(.6, 2.2);
    }
    empty.hidden = all.length > 0;
  }

  let last = performance.now();
  function frame(now) {
    step(Math.min(.1, (now - last) / 1000));
    last = now;
    requestAnimationFrame(frame);
  }

  function add(c) {
    if (!c || !c.text || all.some(o => o.id === c.id)) return;
    all.push(c);
    spawn(c, true);
  }

  XGComments.load().then(list => {
    all = list;
    // start with the screen part-way full, each at its own point in its climb
    const first = Math.min(room(), all.length);
    for (let i = 0; i < first; i++) {
      const c = next();
      if (!c) break;
      spawn(c, false, rand(0, .7));
    }
    empty.hidden = all.length > 0;
    XGComments.listen(add);
  });
  requestAnimationFrame(frame);

  // for checking by hand: __comments.step(1), __comments.add({id:'x1', text:'…', time:Date.now()})
  window.__comments = { step, add, get live() { return live; }, get all() { return all; } };
})();
</script>
<script src="../shared/back.js" data-color="#e8e2d4"></script>
</body>
</html>
