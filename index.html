<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Stack — Isometric Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  /* The display face used on the panels. Only the OpenType file is here;
     there is no woff2 to list ahead of it, and naming one that is not there
     costs every visitor a 404 before the fallback. Playfair Display stands
     in if this fails to load. */
  @font-face{
    font-family:'Nomark';
    src: url('./fonts/nomark.otf') format('opentype');
    font-display: swap;
  }
  :root{
    --bg: #191818;
    --ink: #e8e2d4;
    --muted: rgba(232,226,212,0.55);
    --line: rgba(232,226,212,0.12);
    --red: #b01d12;
  }
  *,*::before,*::after{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{ position:fixed; inset:0; }

  /* The ground behind the fan: the "end" composition taken apart into its
     layers so each can move on its own — the cracked glass plate, then the
     stars, the bubbles and the pixels on top, all drawn on the same 16:9
     sheet. Every layer is the same box with the same `cover` fit, so at
     rest they line up exactly as in end.png; the box is a little larger
     than the window so drifting never shows an edge. That overscan is the
     whole budget the parallax has to spend — twelve percent a side, which
     is what lets the drift be as large as it is. */
  .backdrop{
    position:fixed; inset:0; z-index:0;
    background: var(--bg);
    overflow:hidden;
    pointer-events:none;
  }
  .backdrop .layer{
    position:absolute; inset:-12%;
    background-position:center; background-size:cover; background-repeat:no-repeat;
    will-change:transform, opacity;
    opacity:0;                 /* the intro brings each one in */
  }
  .layer--plate { background-image:url('main-assets/plate.jpg'); }
  .layer--star  { background-image:url('main-assets/star.png'); }
  .layer--bubble{ background-image:url('main-assets/bubble.png'); }
  .layer--pixel { background-image:url('main-assets/pixel.png'); }
  @media (prefers-reduced-motion: reduce){
    .backdrop .layer{ opacity:1; }
  }

  /* ---------- Opening wordmark ----------
     The flat logo is one file: the compass mark, OUTERCHORD, and the
     Korean line beneath. The opening shows the mark alone in the middle of
     the ring and then lets the word out beside it, which is a matter of
     clipping rather than of two images — `.openlogo__line` is the window,
     and it widens from the mark's share of the artwork to all of it while
     the word inside keeps its full width and slides out from under the
     right edge.

     The numbers are measured off the file, which is 1600x294 (the 10-21
     wordmark). The O's right side doubles as the U's left stem, so no
     straight window can hold the O without a piece of the U. While the
     mark is alone it is drawn from logo-mark.png instead: the same sheet
     with only the compass O on it — the U's stem and bowl taken off, and
     the lower-right frame, which the stem covers in the wordmark, redrawn
     from the upper-right one. The full sheet takes over as the word starts
     to slide out. The window opens at 252/1600, just past the needle's
     tip; the wordmark band ends at y=248 and the Korean line starts at
     y=250, which is where the two are split onto their own elements. The
     window is centred, so the lockup is centred at both ends and the mark
     drifts left as the word arrives. */
  .openlogo{
    /* tied to the shorter side of the window, the same measure the ring
       uses, so the gap between the word and the cards holds at any shape.
       On a 16:9 the two terms meet, so this is the 26vw it was before. */
    --logo-w: min(26vw, 46vh);
    position:fixed; left:50%; top:50%;
    width: var(--logo-w);
    transform: translate(-50%, -50%);
    display:flex; flex-direction:column; align-items:center;
    z-index:5;                 /* above the backdrop, below the cards */
    opacity:0;                 /* the opening brings it in */
    pointer-events:none;
  }
  .openlogo__line{
    overflow:hidden;
    width: calc(var(--logo-w) * 252 / 1600);
  }
  .openlogo__word{
    width: var(--logo-w);
    height: calc(var(--logo-w) * 248 / 1600);
    background: url('main-assets/logo-mark.png') 0 0 / 100% auto no-repeat;
  }
  .openlogo__word.is-word{ background-image: url('main-assets/logo.png'); }
  .openlogo__sub{
    width: var(--logo-w);
    height: calc(var(--logo-w) * 44 / 1600);
    margin-top: calc(var(--logo-w) * 2 / 1600);
    background: url('main-assets/logo.png') 0 calc(var(--logo-w) * -250 / 1600) / 100% auto no-repeat;
    opacity:0;                 /* it joins once the word is all the way out */
  }

  /* ---------- Left brand panel ---------- */
  .panel-left{
    position:fixed; left:56px; top:52px; z-index:30;
    max-width:280px;
    /* opacity is driven by GSAP, which is already stop-motion stepped */
  }
  .panel-left .logo{
    display:block;
    width: clamp(200px, 17vw, 330px);
    height:auto;
  }

  /* bottom-left hint */
  .hint{
    position:fixed; left:56px; bottom:44px; z-index:30;
    display:flex; align-items:center; gap:10px;
    font-family:'Pretendard Variable', Pretendard, 'Inter', sans-serif;
    font-size:12px; letter-spacing:0.5px;
    color: var(--muted);
    /* opacity is driven by GSAP, which is already stop-motion stepped */
  }
  .hint .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--ink);
    /* stepped so the blink lands on the same beat as everything else */
    animation: pulse 1.8s steps(11, end) infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.25; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1); }
  }

  /* ---------- Right meta index ---------- */
  /* Top-right, out of the fan's path. The arc sweeps through the bottom
     corners, so index type parked down there gets run over by the cards. */
  .panel-right{
    position:fixed; right:56px; top:52px; z-index:30;
    text-align:right;
    /* opacity is driven by GSAP, which is already stop-motion stepped */
  }
  .panel-right .m-index{
    font-family:'Inter',monospace;
    font-size:11px;
    letter-spacing:2px;
    color: var(--muted);
    margin-bottom:6px;
  }
  .panel-right .m-title{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    line-height:1.2;
  }
  .panel-right .m-desc{
    margin-top:4px;
    font-size:12px;
    color: var(--muted);
  }

  /* ---------- Detail view ----------
     What a card opens into. The solid field grows out of the middle and
     fills the viewport; the card itself keeps its size and slides over to
     the left, so the artwork stays artwork instead of becoming the page.
     Positions are all viewport fractions, taken off the panel layouts. */
  .detail{
    position:fixed; inset:0;
    pointer-events:none;
    /* Where each text block's line box starts. Horizontal positions and
       type sizes are exact to the panel; these two are the only values
       that depend on the display face's own metrics, so nudge them once
       the real Nomark file is in place. */
    --title-top: 26.27%;
    --body-top: 45.8%;
  }
  .detail__fill{
    position:absolute; inset:0;
    z-index:15;
    background:#C0341A;
    transform:scale(0);
    will-change:transform;
  }
  .detail__content{
    position:absolute; inset:0;
    z-index:25;
    opacity:0;
    color:#E8E2D4;
  }
  /* Sizes are fractions of the viewport width, so the composition is
     pixel-identical to the 1920×1080 panel and stays in proportion at any
     other window size. Percentages in the comments are the panel values. */
  .detail__title{
    position:absolute;
    left:43.54%;            /* 836px */
    top:var(--title-top);
    right:6%;
    margin:0;
    font-family:'Nomark', 'Playfair Display', serif;
    font-weight:500;
    font-size:4.063vw;      /* 78pt */
    line-height:1.18;       /* ≈92px between the two lines */
    text-transform:uppercase;
    white-space:nowrap;     /* every title fits one line; the longest, SOUND OF NOT THE EARTH, fills about 97% */
  }
  .detail__body{
    position:absolute;
    left:51.52%;            /* 989px */
    top:var(--body-top);
    right:6%;
    font-family:'Pretendard Variable', Pretendard, 'Inter', sans-serif;
    font-weight:500;        /* Medium */
    font-size:1.25vw;       /* 24pt */
    line-height:2.1667;     /* 52pt leading */
    letter-spacing:-0.075em;/* tracking -75 */
  }
  .detail__body span{ display:block; }

  /* The arrow is the way out of the detail view — nothing navigates on its
     own any more. It only accepts clicks once the view has actually landed,
     otherwise it would be a live target while still invisible. */
  .detail__go{
    position:absolute;
    right:5.63%;            /* 108px */
    bottom:9.9%;            /* 107px */
    width:5.99vw;           /* 115px */
    height:5.99vw;
    padding:0;
    border:0;
    background:none;
    color:inherit;
    cursor:pointer;
    pointer-events:none;
    /* transform only — opacity here belongs to GSAP, and a CSS transition
       on the same property would fight it during the reveal */
    transition: transform .2s steps(3, end);
  }
  .detail.is-open .detail__go{ pointer-events:auto; }
  .detail__go:hover,
  .detail__go:focus-visible{
    transform: translate(7%, 7%);
  }
  .detail__go:focus-visible{ outline:2px solid currentColor; outline-offset:8px; }
  .detail__arrow{
    display:block;
    width:100%; height:100%;
    stroke:currentColor;
    stroke-width:2;
    fill:none;
  }

  /* ---------- Stage ---------- */
  .scene{
    position:fixed; inset:0;
    z-index:10;
    touch-action: none;
    cursor: grab;
  }
  .scene.dragging{ cursor: grabbing; }
  .stack{
    position:absolute; inset:0;
  }
  .card{
    position:absolute;
    top:50%; left:50%;
    width: clamp(180px, 17vw, 260px);
    height: clamp(180px, 17vw, 260px);
    aspect-ratio: 1 / 1;
    will-change: transform, opacity;
  }
  /* The line that draws itself round a hovered card. It sits outside
     .card-inner so the clipped artwork cannot cut it off, and takes no
     pointer events so it never steals the hover it is reacting to. */
  .card__outline{
    position:absolute;
    inset:-7%;
    overflow:visible;
    pointer-events:none;
    opacity:0;
  }
  .card__outline path{
    fill:none;
    stroke: var(--red);
    /* In viewBox units, not pixels. non-scaling-stroke would hold the
       weight steady at any card size, but it also makes the browser read
       stroke-dasharray in screen pixels while getTotalLength() stays in
       viewBox units — the two disagree by the viewBox scale (~2.9x here),
       so a single dash meant to wrap the card once repeats three times and
       the line comes out dotted. Sizing the stroke in the same units as
       the dash keeps them in step; the card barely changes size anyway, so
       the weight lands a touch either side of a pixel across the fan —
       fine enough to read as drawn rather than printed, and not so fine
       that it drops out where it crosses a neighbouring card. */
    stroke-width:0.38;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .card-inner{
    position:absolute; inset:0;
    border-radius:4px;
    overflow:hidden;
    box-shadow:
      0 30px 70px -18px rgba(20,20,15,0.35),
      0 6px 18px -6px rgba(20,20,15,0.12);
    will-change: transform, border-radius;
    backface-visibility:hidden;
  }
  .card__thumb{
    position:absolute; inset:0;
    background: var(--bg-img);
  }
  /* ---------- make chord ----------
     A record that turns up at the bottom of the index once a visitor has
     been through at least one piece; it leads to the page that plays
     everything collected so far back as music. */
  .chord-btn{
    position:fixed; left:50%; bottom:clamp(18px, 3.2vh, 40px); z-index:30;
    width:clamp(96px, 7.6vw, 146px); height:clamp(96px, 7.6vw, 146px);
    margin-left:calc(clamp(96px, 7.6vw, 146px) / -2);
    padding:0; border:0; border-radius:50%;
    background:none; cursor:pointer; color:var(--ink);
    display:none;
    -webkit-tap-highlight-color:transparent;
  }
  .chord-btn.is-shown{ display:block; }
  .chord-btn .shadow{ display:block; width:100%; height:100%; }
  .chord-btn img{ display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }
  .chord-btn .disc{
    transform-origin:50% 50%;
    /* 33⅓ rpm, stepped like everything else on the page */
    animation: spin 3.6s steps(24, end) infinite;
  }
  .chord-btn:hover .disc,
  .chord-btn:focus-visible .disc{ animation-duration: 1.8s; }
  .chord-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:6px; }
  .chord-btn .shadow{ filter: drop-shadow(0 14px 22px rgba(0,0,0,0.55)); }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  /* on a narrow window the bottom-left hint would run under the record */
  @media (max-width: 1100px){
    body.has-chord .hint{ bottom: calc(clamp(96px, 7.6vw, 146px) + clamp(18px, 3.2vh, 40px) + 18px); }
  }

  /* Once a card is opening, the stage is raised above the colour field so
     the artwork sits on top of it — but that also puts the stack's own
     transparent full-screen box over the detail view. Nothing in the stage
     is interactive any more at that point, so it stops taking clicks and
     lets them through to the arrow. */
  .scene.activated{ cursor: default; pointer-events: none; }
  /* ...except the opened card, which takes a double click through to the site */
  .scene.activated .card.is-live{ pointer-events: auto; cursor: pointer; }
</style>
</head>
<body>

<div class="app">

  <div class="hint">

  <div class="panel-right">

  </div>

  <!-- the view a card opens into; text and artwork get dropped in later -->
  <div class="detail" id="detail" aria-hidden="true">
    <div class="detail__fill" id="detailFill"></div>
    <div class="detail__content" id="detailContent">

         part that turns, as the drawn disc did -->
    <span class="shadow"><img class="disc" src="main-assets/chord-record.png" alt="" draggable="false"></span>
  </a>

</div>

<script>
(function(){

  /* ---------------- Stop-motion clock ----------------
     Every moving thing on screen is driven by GSAP's ticker, so throttling
     that single clock steps the whole piece at once instead of having to
     rewrite each animation.

     The hold length is re-drawn every tick, so no two frames are held for
     exactly the same time. That is what separates "shot by hand" from
     "low frame rate": a machine-perfect 12fps still reads as digital,
     while a wobbling hold reads as a camera being tapped frame by frame. */
  const STOP_MOTION_FPS = 32;        // the cards — stepped but close to fluid

  const HOLD_JITTER = 0.15;          // ±15% on each frame's hold

  const jitteredHold = (fps, jitter = HOLD_JITTER) =>
    (1000 / fps) * (1 + (Math.random() * 2 - 1) * jitter);

  /* A frame can only ever be released on a repaint, so any requested hold
     gets rounded up to the next one — ask for 31ms on a 60Hz screen and you
     get a flat 33ms every time, which erases the jitter and drags the rate
     down. Booking the next beat off the previous *boundary* instead of off
     "now" carries that overshoot into the following frame, so short and long
     holds alternate and the average lands on the rate we asked for. */
  let cardBeat = 0;

  function reseedHold(time){
    cardBeat += jitteredHold(STOP_MOTION_FPS) / 1000;
    if (cardBeat < time) cardBeat = time + jitteredHold(STOP_MOTION_FPS) / 1000;
    gsap.ticker.fps(1 / Math.max(cardBeat - time, 0.001));
  }
  gsap.ticker.fps(STOP_MOTION_FPS);
  gsap.ticker.add(reseedHold);

  /* ---------------- Data ---------------- */
  const CARD_PERSPECTIVE = 650;   // px; see the hover lean further down

  const projects = [
    /* `panel` / `ink` drive the detail view the card opens into: the solid
       field that grows out of the middle and the type that sits on it.
       `body` is the paragraph under the title, one array entry per line. */

       opens the piece whether the folder is served (server.ps1, GitHub
       Pages) or opened straight off the disk — a bare "d/" only gets a
       directory listing under file://. `bg` falls back to a gradient for
       pieces without a still of their own. */
    /* body: one entry per line as it is set; '' is an empty line between
       stanzas. desc is the subtitle in the index's top-right corner only. */
    { id:1, title:"Cattle Mutilation", desc:"캐틀 뮤틸레이션", url:"cattlemutilation/index.html", bg:"url('cattlemutilation/thumb.webp') center/cover no-repeat, #111",

        "육신으로부터의 탈출!",

        "달에 갈 생각은 아니었어."] },
    { id:2, title:"Sound of Not the Earth", desc:"Voyager Golden Record", url:"e/index.html", bg:"url('e/thumb.webp') center/cover no-repeat, #111",
      panel:"#bc2d0b", ink:"#cfccc2", body:[
        "보이저 골든 레코드는 보이저 탐사선 두 대에 실린 축음기 음반으로",
        "외계 생명체에게 인류의 메세지를 전달하고자",
        "지구의 모습과 소리를 담은 LP 디스크이다.",
        "",
        "언젠가 돌아갈 외계로 단 하나 메세지를 전한다면",
        "당신은",
        "어떤 음을 넣을 것인가."] },
    // panel / ink taken off each thumbnail: its ground, and its brightest line colour
    { id:3, title:"05-Noctiluca",      desc:"Bio-Matrix",       url:"d/index.html",      bg:"url('d/thumb.webp') center/cover no-repeat, #0f1112",

  /* ---------------- Sketched outline ----------------
     A rounded rectangle walked point by point, with every point nudged off
     the true path, then smoothed through the midpoints. Drawing it as one
     continuous curve rather than a CSS border is what lets it be dashed on
     from a single end — and what stops it looking machine-ruled. */
  function sketchedOutline(inset = 5){
    const a = inset, b = 100 - inset, r = 9, jit = 1.7;
    const perEdge = 6, perCorner = 4;
    const pts = [];
    const add = (x, y) => pts.push([
      x + (Math.random() - 0.5) * jit,
      y + (Math.random() - 0.5) * jit
    ]);
    const corner = (cx, cy, from) => {
      for (let i = 0; i <= perCorner; i++){
        const t = from + (Math.PI / 2) * (i / perCorner);
        add(cx + Math.cos(t) * r, cy + Math.sin(t) * r);
      }
    };
    const span = b - a - 2 * r;
    for (let i = 0; i < perEdge; i++) add(a + r + span * (i / perEdge), a);
    corner(b - r, a + r, -Math.PI / 2);
    for (let i = 0; i < perEdge; i++) add(b, a + r + span * (i / perEdge));
    corner(b - r, b - r, 0);
    for (let i = 0; i < perEdge; i++) add(b - r - span * (i / perEdge), b);
    corner(a + r, b - r, Math.PI / 2);
    for (let i = 0; i < perEdge; i++) add(a, b - r - span * (i / perEdge));
    corner(a + r, a + r, Math.PI);

    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const n = pts.length;
    const start = mid(pts[n - 1], pts[0]);
    let d = `M${start[0].toFixed(2)} ${start[1].toFixed(2)}`;
    for (let i = 0; i < n; i++){
      const cur = pts[i], m = mid(cur, pts[(i + 1) % n]);
      d += `Q${cur[0].toFixed(2)} ${cur[1].toFixed(2)} ${m[0].toFixed(2)} ${m[1].toFixed(2)}`;
    }
    return d + 'Z';
  }

    const outline = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

     every card sits on a circle whose centre is far below the viewport,

     to height alone works on a squarish window but on a 16:9 one the arc
     is narrower than the screen, so cards would pile up near the ends

     whole thing swings out into the resting fan.

     wide the circle is, the gap between neighbours, and a spin offset. Run

     main screen exactly, with no hand-off and nothing to keep in step.

     the whole thing over onto the resting pose, which is worked out fresh

  const opening = {

    cyF: 0.5,        // it stays there — only the radius opens out
    rF: 0,           // ring radius, against the shorter side of the viewport;

                     // on the exact centre and only the lead card is seen
    step: 0,         // degrees between neighbours; 0 stacks them all up
    spin: 0,         // turns the ring, carrying the lead round with it
    scale: 0.42,     // the deck arrives small and is zoomed into at the end
    reveal: 0,       // the cards waiting behind the lead

  function slotFor(i, from){

    return rel > n / 2 ? rel - n : rel;
  }

    const restR = arcRadius();

    let r = restR, cx = vw / 2, cy = ARC_APEX * vh + restR,
        step = ARC_STEP_DEG, spin = 0, scale = 1, behind = 1;

  /* The stack rides a spring rather than an exponential glide. An
     exponential only ever creeps up on its target, which reads as soft; a
     spring carries its momentum past the mark and pulls back, so a card

     leaves the overshoot in. Integrated in fixed sub-steps so the feel is
     identical whatever the frame rate, and so a long stall cannot hand the

  const SPRING_K = 170;        // pull toward the target

  let hoveredCard = null, restingCard = null;

    if (liftTarget.get(card) === want) return;

      ? { z: want, duration: 0.45, ease: 'power2.out', overwrite: 'auto' }
      : { z: 0,    duration: 0.5,  ease: 'power3.out', overwrite: 'auto' });

  // has settled on a whole card and nothing is pulling it: no drag, no
  // wheel still easing in, no opening, no card open.
  function updateResting(){

      && targetIndex === Math.round(targetIndex)
      && Math.abs(targetIndex - currentDisplay) < 0.015
      && Math.abs(springVel) < 0.08;
    const next = settled ? cardEls[((Math.round(currentDisplay) % n) + n) % n] : null;

    const prev = restingCard;
    restingCard = next;
    if (prev) updateLift(prev);

     that wraps almost the whole way round with one travelling gap where
     its two ends fail to meet. `covered` is how much of the lap the stroke
     takes up, `lap` how long one turn takes — negative runs it backwards. */
  const RING_SPEC = [

    { covered: 0.86, lap: 1.9 }    // inner, a touch slower so the two
  ];                               // gaps drift apart instead of locking

     cards': eight frames a second, each held a good deal longer or
     shorter than the last. A tween would ride the card ticker and glide,
     so the offset is driven by hand — nothing is written between beats,
     and that gap is the hold.

     Fewer frames to a lap means a bigger jump in each one, and the wobble
     is wide enough here that the jumps come out plainly uneven — which is
     the difference between a cheap frame rate and a camera being tapped by
     hand.

     Eight is also about the floor for this lap: at a brisk 1.4s a turn
     the gap already moves a ninth of the way round between frames, and
     much past that it stops reading as travelling and starts reading as
     flickering in place. */
  const LINE_FPS = 8;
  const LINE_JITTER = 0.3;           // ±30%, twice the cards' wobble
  const liveRings = new Set();
  let lineClock = 0, lineNextBeat = 0;

    lineClock += Math.min(deltaTime, 200) / 1000;
    if (lineClock < lineNextBeat) return;          // still holding this frame

    /* Booking the next beat off the previous boundary rather than off now
       carries the overshoot forward, so the average lands on LINE_FPS
       instead of collapsing onto the faster clock underneath. */
    const hold = jitteredHold(LINE_FPS, LINE_JITTER) / 1000;
    lineNextBeat += hold;
    if (lineNextBeat < lineClock - hold) lineNextBeat = lineClock + hold;

    for (const r of liveRings) {
      gsap.set(r.path, { strokeDashoffset: -((lineClock % r.lap) / r.lap) * r.len });
    }
  });

  cardEls.forEach(card => {
    const svg = card.querySelector('.card__outline');
    const rings = [...svg.querySelectorAll('path')].map((path, i) => {
      const spec = RING_SPEC[i];
      const len = path.getTotalLength();
      // one dash and one gap over the whole lap, so the stroke reads as a
      // single continuous line rather than a row of ticks
      gsap.set(path, {
        strokeDasharray: `${len * spec.covered} ${len * (1 - spec.covered)}`,
        strokeDashoffset: 0
      });
      return { path, len, lap: spec.lap };
    });

    const canHover = () => !activated && !isDragging && !opening.running;

    card.addEventListener('pointerenter', () => {
      if (!canHover()) return;
      gsap.killTweensOf(svg);
      gsap.to(svg, { opacity: 1, duration: 0.2 });
      /* The outline is walked clockwise when it is built, and dash offset
         counts backwards along that walk — so the stepper, driving the
         offset negative, sends the gap round clockwise. The rings keep
         going for as long as the pointer stays on the card. */
      rings.forEach(r => liveRings.add(r));
      hoveredCard = card;
      updateLift(card);
    });

    card.addEventListener('pointermove', e => {
      if (!canHover()) return;
      const r = card.getBoundingClientRect();
      const nx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      const ny = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      gsap.to(card, {
        rotationY: Math.max(-1, Math.min(1, nx)) * TILT_MAX,
        rotationX: Math.max(-1, Math.min(1, ny)) * -TILT_MAX,
        duration: 0.5, ease: 'power2.out'
      });
    });

    card.addEventListener('pointerleave', () => {
      // the rings keep stepping round as they fade, rather than stopping dead
      gsap.to(svg, { opacity: 0, duration: 0.28,
                     onComplete: () => rings.forEach(r => liveRings.delete(r)) });
      gsap.to(card, { rotationX: 0, rotationY: 0,
                      duration: 0.5, ease: 'power3.out' });
      if (hoveredCard === card) hoveredCard = null;
      updateLift(card);   // stays forward if it is still the card at rest
    });
  });

  // a card being opened must not carry a leftover lean into the detail view
  function clearHover(card){
    const svg = card.querySelector('.card__outline');
    // the lift and lean are tweens too: setting z back without killing them
    // lets an in-flight lift finish and put the card straight back up
    gsap.killTweensOf([svg, card]);
    gsap.set(svg, { opacity: 0 });
    gsap.set(card, { rotationX: 0, rotationY: 0, z: 0 });
    liftTarget.set(card, 0);
    // the fan picks its resting card again once it is back
    if (hoveredCard === card) hoveredCard = null;
    if (restingCard === card) restingCard = null;
    // only one card is ever hovered, so there is nothing left to step
    liveRings.clear();
  }


  /* ---------------- Backdrop ----------------
     The layers of the "end" sheet, each moving in its own way:
       glass   — a very slow push in and out
       stars   — drifting, with a faint twinkle
       bubbles — breathing like a cell, and boiling: a hair of jitter on
                 every frame, the way a hand-drawn line never sits still
       pixels  — mostly still, then every few seconds a glitch that jumps
                 them a whole cell or blinks them out
     plus a little parallax against the pointer, deeper layers moving less.
     It runs on its own slower beat (~12 frames a second, each held for a
     slightly different time) so it reads as stop-motion against the
     cards, and it rests while a card is open or the tab is hidden. */
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layer = name => document.querySelector('.layer--' + name);
  const L = { plate: layer('plate'), star: layer('star'), bubble: layer('bubble'), pixel: layer('pixel') };
  const logoEl = document.querySelector('.panel-left .logo');

  // what the intro drives; the loop below reads it on every beat
  const intro = { plate: 0, plateScale: 1.07, star: 0, bubble: 0, pixel: 0 };
  if (!reduceMotion) {
    gsap.timeline()
      .to(intro, { plate: 1, plateScale: 1, duration: 1.0, ease: 'steps(8)' }, 0)
      .to(intro, { star: 1, duration: 1.2, ease: 'steps(10)' }, .3)
      .to(intro, { bubble: 1, duration: 1.3, ease: 'steps(12)' }, .55)
      .to(intro, { pixel: 1, duration: .45, ease: 'steps(4)' }, 1.35);
  }

  const BG_FPS = 12;
  const jit = a => (Math.random() * 2 - 1) * a;
  const wave = (time, period) => Math.sin(time * 2 * Math.PI / period);
  const par = { x: 0, y: 0, tx: 0, ty: 0 };

  /* Each layer is pushed the opposite way to the pointer, deeper layers
     less, which is what sells the depth. The two axes carry their own
     gain and their own unit: sideways in vw, up and down in vh. Measured
     that way the drift no longer changes with the window shape. It was
     vw on both axes once, which on a 16:9 window moved the layers as far
     vertically as horizontally across a viewport only 56% as tall as it
     is wide, and the vertical came out reading as half the movement.

     Both are spent out of the layers overscan. Vertical is the tight
     axis: at 3.2 the deepest layer already uses over half the room it
     has, while sideways at 2.0 it uses barely a third. Raise either much
     further and the inset has to go up with it, or an edge drags in. */
  const PARALLAX_X = 2.0;   // in vw
  const PARALLAX_Y = 3.2;   // in vh, larger because a vh is the smaller unit
  const pixelGlitch = { until: 0, next: 2.8, dx: 0, dy: 0, hide: false };
  const logoGlitch = { until: 0, next: 5 };
  let bgBeat = 0;

  window.addEventListener('pointermove', e => {
    par.tx = e.clientX / window.innerWidth * 2 - 1;
    par.ty = e.clientY / window.innerHeight * 2 - 1;
  }, { passive: true });

  // one pixel square of the artwork, in screen px: the squares are 23px
  // on the 2000px-wide sheet, and the sheet is fitted with `cover`
  function pixelCell(){
    const w = L.pixel.offsetWidth, h = L.pixel.offsetHeight;
    return Math.max(w, h * 16 / 9) * 23 / 2000;
  }

  function drawBackdrop(time){
    const vw = window.innerWidth / 100;
    const vh = window.innerHeight / 100;
    const px = depth => -par.x * depth * PARALLAX_X * vw;
    const py = depth => -par.y * depth * PARALLAX_Y * vh;
    par.x += (par.tx - par.x) * .3;
    par.y += (par.ty - par.y) * .3;

    gsap.set(L.plate, {
      x: px(.35), y: py(.35),
      scale: intro.plateScale * (1 + .012 * wave(time, 22)),
      opacity: intro.plate,
    });

    gsap.set(L.star, {
      x: px(.8) + wave(time, 41) * .9 * vw,
      y: py(.8) + wave(time + 9, 57) * .5 * vh,
      opacity: intro.star * (.86 + Math.random() * .14),
    });

    // the bubbles open out of the middle during the intro
    const b = intro.bubble;
    gsap.set(L.bubble, {
      x: px(1.4) + jit(1.3), y: py(1.4) + jit(1.3),
      scale: 1 + .02 * wave(time, 7),
      rotation: .6 * wave(time, 19),
      opacity: b > 0 ? 1 : 0,
      clipPath: b < 1 ? `circle(${(b * 75).toFixed(1)}% at 50% 50%)` : 'none',
    });

    if (time > pixelGlitch.next) {
      const c = pixelCell();
      pixelGlitch.until = time + .12 + Math.random() * .28;
      pixelGlitch.next = time + 2 + Math.random() * 3.8;
      pixelGlitch.dx = c * Math.round(jit(2.4));
      pixelGlitch.dy = c * Math.round(jit(1.4));
      pixelGlitch.hide = Math.random() < .3;
    }
    const glitching = time < pixelGlitch.until;
    gsap.set(L.pixel, {
      x: px(2.1) + (glitching ? pixelGlitch.dx : 0),
      y: py(2.1) + (glitching ? pixelGlitch.dy : 0),
      opacity: intro.pixel * (glitching && pixelGlitch.hide ? 0 : 1),
    });

    // the wordmark stutters now and then
    if (time > logoGlitch.next) {
      logoGlitch.until = time + .1 + Math.random() * .14;
      logoGlitch.next = time + 4 + Math.random() * 6;
    }
    const stutter = time < logoGlitch.until;
    gsap.set(logoEl, {
      x: stutter ? jit(7) : 0,
      skewX: stutter ? jit(10) : 0,
      opacity: stutter && Math.random() < .4 ? .4 : 1,
    });
  }

  if (!reduceMotion) {
    gsap.ticker.add(time => {
      if (time < bgBeat) return;
      bgBeat = time + (1 / BG_FPS) * (1 + jit(.2));
      if (activated || document.hidden) return;
      drawBackdrop(time);
    });
  }

  /* The opening runs the pose above into the fan's own. Everything the
     page offers is held back until it lands, and anyone who has asked for
     less motion simply starts on the finished screen. */
  if (!reduceMotion) {
    opening.running = true;
    const openLogo = document.getElementById('openLogo');
    const openLogoLine = document.getElementById('openLogoLine');
    const openLogoSub = document.getElementById('openLogoSub');
    const openLogoWord = openLogoLine.querySelector('.openlogo__word');
    // fetched now so the swap at the word's entrance never waits on the network
    new Image().src = 'main-assets/logo.png';
    gsap.set([panelLeft, panelRight, hintEl, chordBtn], { opacity: 0 });

    gsap.timeline({ onComplete: () => { opening.running = false; } })
      // one card, alone in the middle
      .fromTo(opening, { scale: 0.04 }, { scale: 0.42, duration: 0.8, ease: 'back.out(1.5)' }, 0)
      // which rises. The lead card sits at the top of the circle, so
      // growing the radius lifts it straight up off the centre; nothing
      // has to be moved sideways to put it there
      .to(opening, { rF: 0.34, duration: 1.1, ease: 'power2.inOut' }, 1.0)
      // the rest surface behind it, stacked, and open out around the ring
      .to(opening, { reveal: 1, duration: 0.35 }, 1.95)
      .to(opening, { step: 360 / n, duration: 1.2, ease: 'power2.out' }, 2.1)
      // which turns a full circle — ending where it started, so the spin
      // can be dropped at the end without anything moving
      .to(opening, { spin: -360, duration: 5.7, ease: 'power1.inOut' }, 2.1)

      // the mark arrives in the middle of the ring, and the word unfolds
      // out beside it; the Korean line joins once it is all the way out
      .to(openLogo, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 2.9)
      // the O alone is its own sheet (no sliver of the U beside it); the
      // full wordmark swaps in just as the word starts to come out
      .call(() => openLogoWord.classList.add('is-word'), null, 3.6)
      .to(openLogoLine, { width: '100%', duration: 1.1, ease: 'power3.inOut' }, 3.6)
      .to(openLogoSub, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 4.7)
      // and it clears out before the fan sweeps through the middle
      .to(openLogo, { opacity: 0, duration: 0.7, ease: 'power1.in' }, 5.9)
      // and finally swings out and grows into the fan
      .to(opening, { blend: 1, duration: 1.8, ease: 'power2.inOut' }, 6.0)
      .to([panelLeft, panelRight, hintEl, chordBtn],
          { opacity: 1, duration: 0.5, ease: 'power1.out' }, 7.0);
  }

  /* ---------------- Pointer helpers ----------------
     The fan runs left to right, so it is dragged left to right too — a
     vertical drag would have the cards travelling at right angles to the
     hand moving them. Dragging left pulls the next card into the middle,
     matching the direction the deck itself moves. */
  function pointX(e){
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return e.clientX;
  }

  /* ---------------- Drag (mouse) ---------------- */
  function onMouseDown(e){
    if (activated || opening.running) return;
    isDragging = true;
    dragMoved = 0;
    dragStartX = pointX(e);
    dragStartIndexAtDrag = targetIndex;
    sceneEl.classList.add('dragging');
  }
  function onMouseMove(e){
    if (!isDragging) return;
    const x = pointX(e);
    const deltaX = dragStartX - x;
    dragMoved = Math.max(dragMoved, Math.abs(deltaX));
    targetIndex = dragStartIndexAtDrag + deltaX / DRAG_SENSITIVITY;
  }
  function onMouseUp(){
    if (!isDragging) return;
    isDragging = false;
    sceneEl.classList.remove('dragging');
    targetIndex = Math.round(targetIndex);
  }

  sceneEl.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  sceneEl.addEventListener('mouseleave', () => { /* keep dragging through leave; released on window mouseup */ });

  /* ---------------- Double click (desktop) ----------------
     Cards are nested 3D-transformed diamonds (rotationX on the
     outer element, rotationZ on the inner one) inside a
     perspective + preserve-3d stage. Hit-testing individual
     rotated layers with elementFromPoint is unreliable across
     browsers in that setup, so a double click/tap anywhere on
     the scene simply opens the card currently at the front. */
  sceneEl.addEventListener('dblclick', () => {
    clearTimeout(singleClickTimer);
    if (activated || opening.running) return;
    activateCard(lastMetaIndex >= 0 ? lastMetaIndex : 0);
  });

  /* ---------------- Single click: next card ----------------
     A single click steps the stack on by one. The action is held for one
     double-click interval so that opening a card does not also advance it. */
  const DOUBLE_CLICK_GRACE = 240;
  let singleClickTimer = null;

  sceneEl.addEventListener('click', () => {
    if (activated || opening.running || dragMoved >= 8) return;
    clearTimeout(singleClickTimer);
    singleClickTimer = setTimeout(() => {
      if (!activated) targetIndex = Math.round(targetIndex) + 1;
    }, DOUBLE_CLICK_GRACE);
  });

  /* ---------------- Touch ---------------- */
  let lastTapTime = 0;

  function onTouchStart(e){
    if (activated || opening.running) return;
    isDragging = true;
    dragMoved = 0;
    dragStartX = pointX(e);
    dragStartIndexAtDrag = targetIndex;
  }
  function onTouchMove(e){
    if (!isDragging) return;
    e.preventDefault();
    const x = pointX(e);
    const deltaX = dragStartX - x;
    dragMoved = Math.max(dragMoved, Math.abs(deltaX));
    targetIndex = dragStartIndexAtDrag + deltaX / DRAG_SENSITIVITY;
  }
  function onTouchEnd(){
    if (!isDragging) return;
    isDragging = false;
    targetIndex = Math.round(targetIndex);

    if (dragMoved < 10){
      const now = Date.now();
      if (now - lastTapTime < 350){
        clearTimeout(singleClickTimer);   // a double tap opens, it does not wipe
        activateCard(lastMetaIndex >= 0 ? lastMetaIndex : 0);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }
  }

  sceneEl.addEventListener('touchstart', onTouchStart, { passive:true });
  sceneEl.addEventListener('touchmove', onTouchMove, { passive:false });
  sceneEl.addEventListener('touchend', onTouchEnd);

  /* ---------------- Wheel ---------------- */
  let wheelTimeout = null;
  sceneEl.addEventListener('wheel', (e) => {
    if (activated || opening.running) return;
    targetIndex += e.deltaY / WHEEL_SENSITIVITY;
    clearTimeout(wheelTimeout);
    wheelTimeout = setTimeout(() => {
      targetIndex = Math.round(targetIndex);
    }, 150);
  }, { passive:true });

  /* ---------------- Activation: stand up + fullscreen morph ---------------- */
  function activateCard(index){
    if (activated || opening.running) return;
    activated = true;

    const card = cardEls[index];
    const inner = card.querySelector('.card-inner');
    const project = projects[index];
    card.style.zIndex = 999;

    cardEls.forEach(clearHover);

    const others = cardEls.filter((_, i) => i !== index);

    // dress the detail view for this project before anything is revealed
    detailFill.style.background = project.panel;
    detailContent.style.color = project.ink;
    detailTitle.textContent = project.title;
    detailBody.innerHTML = bodyHTML(project.body);
    const bodyLines = [...detailBody.children];

    // the card has to ride above the field it lands on
    sceneEl.style.zIndex = 20;
    sceneEl.classList.add('activated');

    pendingUrl = project.url;
    activeCard = card;

    /* Everything the opening touches lives on this one timeline — the rest
       of the deck, the index furniture, the card's own caption — so that
       swiping back can simply run it in reverse and leave the fan exactly
       as it was. */
    const tl = gsap.timeline({
      onComplete: () => {
        detailEl.classList.add('is-open');
        card.classList.add('is-live');
      }
    });
    openTl = tl;

    tl.to(others, {
        y: '+=340', opacity: 0,
        duration: 0.4, ease: 'power2.in', stagger: 0.03
      }, 0)
      .to([panelLeft, panelRight, hintEl, chordBtn],
          { opacity: 0, duration: 0.3, ease: 'power1.out' }, 0)
      // the record would sit on top of the detail view's type otherwise
      .set(chordBtn, { pointerEvents: 'none' }, 0)

      // 1. the card squares up where it is, at the size it already is
      .to(card, {
        rotation: 0, x: 0, y: 0, scale: 1,
        duration: 0.35, ease: 'power3.out'
      }, 0)

      // 2. the solid field opens out of the middle and takes the viewport
      .to(detailFill, {
        scale: 1, duration: 0.62, ease: 'power3.inOut'
      }, 0.26)

      // 3. the card grows into the 502px artwork slot on the left
      .to(card, {
        x: () => (DETAIL_CARD_X - 0.5) * window.innerWidth,
        y: () => (DETAIL_CARD_Y - 0.5) * window.innerHeight,
        scale: () => (DETAIL_CARD_SIZE * window.innerWidth) / card.offsetWidth,
        duration: 0.6, ease: 'power3.inOut'
      }, 0.42)

      // the stack's rounding and drop shadow belong to the deck, not to a
      // piece of artwork lying flat on a colour field
      .to(inner, {
        borderRadius: 0,
        boxShadow: '0 30px 70px -18px rgba(20,20,15,0), 0 6px 18px -6px rgba(20,20,15,0)',
        duration: 0.6, ease: 'power3.inOut'
      }, 0.42)

      // 4. the type arrives once there is a field to sit on.
      //    fromTo, not from: closing runs this timeline backwards and
      //    leaves the title and arrow at opacity 0, and a plain from()
      //    would then take that as its end state on the next open.
      .to(detailContent, { opacity: 1, duration: 0.01 }, 0.72)
      .fromTo(detailTitle, { opacity: 0, y: 28 }, {
        opacity: 1, y: 0, duration: 0.5, ease: 'power2.out'
      }, 0.72)
      .fromTo(bodyLines, { opacity: 0, y: 18 }, {
        opacity: 1, y: 0, duration: 0.45, ease: 'power2.out', stagger: 0.07
      }, 0.86)

      // 5. the arrow arrives last, since it is now the only way onward
      .fromTo(detailGo, { opacity: 0 }, {
        opacity: 1, duration: 0.4, ease: 'power2.out'
      }, 1.05);
  }

})();
</script>
</body>
</html>
